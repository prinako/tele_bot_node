services:
  backend:
    environment:
      NODE_ENV: development
    command: npm run dev
    volumes:
      - ./backend:/app
      - backend_node_modules:/app/node_modules

  tele_bot:
    environment:
      NODE_ENV: development
    command: npm run dev
    volumes:
      - ./tele_bot:/app
      - tele_bot_node_modules:/app/node_modules

  admin_panel:
    build: !reset null
    image: node:22-bookworm-slim
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    environment:
      VITE_BACKEND_URL: ${VITE_BACKEND_URL:-http://localhost:3000}
    ports: !override
      - "${ADMIN_PANEL_PORT:-5173}:5173"
    volumes:
      - ./admin_panel:/app
      - admin_panel_node_modules:/app/node_modules

  postgres:
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/src/db/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro

volumes:
  backend_node_modules:
  tele_bot_node_modules:
  admin_panel_node_modules:
  postgres_data:
